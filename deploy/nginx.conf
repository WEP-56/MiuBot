# Miubot 反向代理参考配置
#
# 安装位置：/etc/nginx/sites-available/miubot → sites-enabled 软链
# 证书：certbot certonly --nginx -d example.com（或 Cloudflare 源站证书）
#
# ⚠️ 不要写 `proxy_set_header Host 127.0.0.1:8787;`。
# 那等于关掉应用的 Host 校验（DNS rebinding 防护），而 Host 校验正是
# 「管理面只能通过这个域名访问」的唯一执行点。应用按 MIUBOT_ALLOWED_HOSTS 自己校验，
# 这里只负责把真实域名传进去。

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # 证书申请走这里，其余一律跳 HTTPS。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 插件 ZIP 上限 20 MB，留点余量；应用自己还有 1 MB 的 JSON 上限。
    client_max_body_size 25m;
    # /api/chat 是同步模型调用，可能几十秒。
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # 应用不读 X-Forwarded-*，这里只为 nginx 自己的日志保留来源信息。
    access_log /var/log/nginx/miubot.access.log;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        # 传真实域名：应用按 MIUBOT_ALLOWED_HOSTS 校验。
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }
}
