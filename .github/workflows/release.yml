name: Release

# 打 tag 即发版：`git tag v0.2.0 && git push origin v0.2.0`
#
# 产出两样东西：
# 1. `ghcr.io/<owner>/<repo>:<version|major.minor|latest>` —— Docker 用户 `docker compose pull`。
# 2. `miubot-v<version>.tar.gz` —— 裸机用户解包即用（含预构建的工作台与生成的模型目录）。
#
# 镜像只构建 linux/amd64：arm64 在 QEMU 下跑 `npm ci` + vite build 要十几分钟且容易超时。
# ARM 机器（Oracle / Hetzner CAX 等）直接 `docker compose up -d --build` 本地构建即可。

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  image:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR 要求全小写；`${VAR,,}` 是 bash 的小写展开。
      - name: 计算镜像名
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: 生成标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 版本号进镜像，工作台的「当前版本」与更新检查都读它。
          build-args: MIUBOT_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  package:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run generate:model-data
      - run: npm run build --workspace=@miubot/web

      - name: 计算镜像名
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # 源码 + 预构建工作台 + 已生成的模型目录。node_modules / .git / 本地数据不进包。
      - name: 打包
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          printf '%s\n' "$version" > VERSION
          mkdir -p dist
          tar czf "dist/miubot-${GITHUB_REF_NAME}.tar.gz" \
            --exclude-vcs \
            --exclude='*node_modules*' \
            --exclude='./apps/server/.miubot' \
            --exclude='./.artifacts' \
            --exclude='./example' \
            --exclude='./ui-ux-design' \
            --exclude='./dist' \
            --exclude='./.github' \
            --transform "s,^\.,miubot-${GITHUB_REF_NAME}," .
          ls -lh dist

      - name: 创建 / 更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 允许重跑：已存在就覆盖附件，不重复建 release。
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz \
              --title "Miubot $GITHUB_REF_NAME" \
              --generate-notes
          fi

      - name: 汇总
        run: |
          {
            echo "### Miubot $GITHUB_REF_NAME"
            echo
            echo "- 镜像：\`${{ env.IMAGE }}:${{ github.ref_name }}\`（去掉 v 的版本号亦可）"
            echo "- 源码包：\`miubot-$GITHUB_REF_NAME.tar.gz\`"
            echo
            echo '```bash'
            echo 'docker compose pull && docker compose up -d'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
