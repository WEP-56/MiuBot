name: CI

# 也被 release.yml 通过 `workflow_call` 复用：发版前必须先过同一套门禁。
# 版本 tag 上不再单独跑一份：release 里的 verify 已经跑过了，两边的 concurrency 组相同，
# 同时触发会互相取消，留下一排误导性的「cancelled」。
on:
  push:
    tags-ignore: ["v*"]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # 与部署文档一致：不跑包的 lifecycle 脚本。
      - name: 安装依赖
        run: npm ci --ignore-scripts

      # 模型目录是提交进仓库的固定快照。这里只校验它与 provider 源码一致，**不联网重新生成**：
      # 生成脚本会拉 models.dev 等上游的当日目录，那样每次 CI 的结果都不一样，测试与类型
      # 会随上游模型增删而红绿（详见 .gitignore 里的说明）。
      - name: 校验模型目录
        run: npm run check:model-data --workspace=@miubot/provider

      - name: 类型检查
        run: npm run check

      - name: Lint / 格式
        run: npm run lint

      - name: 单元测试
        run: npm test

      # 工作台产物不在版本库里，但服务端要托管它；这里顺带验证构建可用。
      - name: 构建工作台
        run: npm run build --workspace=@miubot/web

      - name: 工作台类型检查
        run: npm run check --workspace=@miubot/web
